[package]
name = "ingest-qnc"
version = "0.1.0"
edition = "2021"
description = "IngestQNC standalone native ingest application"

[[bin]]
name = "IngestQNC"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["accesskit", "default_fonts", "wayland", "wgpu", "x11"] }
egui = "0.31"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem"] }
